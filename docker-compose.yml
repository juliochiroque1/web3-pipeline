

services:
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ETH.sql:/docker-entrypoint-initdb.d/ETH.sql

  python_extractor:
    build: .
    env_file:
      - .env
    depends_on:
      - database


volumes:
  postgres_data:
    external: true
    name: 45550f12122ba052dff4c39246862a7ce78e5e4404df1161dd298dd4aece91c5